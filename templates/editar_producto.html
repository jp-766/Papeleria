{% extends 'plantilla.html' %}

{% block titulo %}Editar productos | Papelia{% endblock %}
{% block cabecera %}Editar productos{% endblock %}

{% block contenido %}

<section class="contenedor-formulario">
    <h2>Modificar producto</h2>

    <form method="POST" action="{{ url_for('editar_producto', id_producto=producto.id_producto) }}"></form>
        
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="nombre">Nombre del producto</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            maxlength="100"
            value="{{ producto.nombre }}"
            required>

        <label for="precio">Precio:</label>
        <input
            type="number"
            id="precio"
            name="precio"
            min="0.01"
            step="0.01"
            value="{{ producto.precio }}"
            required>

        <label for="stock">Existencias:</label>
        <input
            type="number"
            id="stock"
            name="stock"
            min="0"
            step="1"
            value="{{ producto.stock }}"
            required>

        <label for="id_categoria">Categoria:</label>
        <select id="id_categoria" name="id_categoria" required>
            <option value="Selecciona una categoria"></option>

            {% for categoria in categorias%}
            <option value="{{ categoria.id_categoria }}"
                {% if categoria.id_categoria == producto.id_categoria %}selected{% endif %}>
            {{ categoria.nombre }}
        </option>
        {% endfor %}
        </select>

        <button type="submit">Guardar cambios</button>
    <a href="{{ url_for('inventario') }}">Cancelar</a>

    </section>
{% endblock %}
